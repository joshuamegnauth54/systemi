[workspace]
members = ["platform", "timedate1"]
resolver = "3"

[workspace.package]
authors = ["Josh Megnauth <jo.sh@tutanota.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause AND GPL-3.0-only"

[workspace.dependencies]
systemi-platform = { path = "platform" }

libc = "0.2"
rustix = { version = "1", features = ["event", "fs", "stdio", "thread", "time"] }
tracing = "0.1"
zbus = "6"
zbus_polkit = { version = "6", default-features = false }
zruntime = "0.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
