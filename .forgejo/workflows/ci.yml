name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: docker
    container:
      image: docker.io/library/rust:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --bins --examples --tests -- -D warnings
      - run: cargo build --workspace --all-targets --all-features
      - run: cargo test --workspace --all-targets --all-features

  freebsd:
    runs-on: freebsd
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: freebsd-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: freebsd-cargo-
      - run: |
          if ! command -v rustup >/dev/null 2>&1; then
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup update stable
          rustup component add clippy rustfmt
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --bins --examples --tests -- -D warnings
          cargo build --workspace --all-targets --all-features
          cargo test --workspace --all-targets --all-features
